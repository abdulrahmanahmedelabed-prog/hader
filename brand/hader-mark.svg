<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hader">
  <defs>
    <linearGradient id="hdr-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14a89c"/>
      <stop offset="1" stop-color="#0b5a6e"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="17" fill="url(#hdr-tile)"/>
  <!-- a crescent open upwards (from the university mark), holding the way in and the way out -->
  <path d="M15.17 19.19 A20 20 0 1 0 48.83 19.19 A17.5 17.5 0 1 1 15.17 19.19 Z" fill="#ffd166"/>
  <g transform="translate(32 30.6) scale(.8) translate(-32 -29.5)">
  <!-- in and out: one arrow coming in, one going out -->
  <path d="M22.5 26.5 H39.5 M35 22 L39.8 26.5 L35 31" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M41.5 35.5 H24.5 M29 31 L24.2 35.5 L29 40" fill="none" stroke="#fff" stroke-opacity=".78" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
