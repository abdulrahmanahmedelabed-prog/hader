name: Release (Hader-Setup.exe)

# Builds the installer here, in the public repository (GitHub Actions is free for public
# repositories), from the PRIVATE source repository, and publishes only the compiled installer on
# this repository's releases page. The source is fetched into the runner with a read-only key,
# compiled (Nuitka: no source in the program), and never committed, uploaded or printed here:
# no artifacts are kept, tests print no tracebacks, and nothing from the source tree is published.
#
# One-time setup: a GitHub fine-grained token with read-only "Contents" on iug-attendance-pro only,
# saved here as the secret PRIVATE_SOURCE_TOKEN (Settings > Secrets and variables > Actions).
# Run: Actions > Release > Run workflow > version (e.g. v1.5.0).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, as in hader/version.py (e.g. v1.5.0)"
        required: true
      ref:
        description: "Branch or tag of the source to build"
        required: false
        default: "main"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: The source key is set
        env:
          KEY: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        run: '[ -n "$KEY" ] || { echo "::error::Add the secret PRIVATE_SOURCE_TOKEN (read-only key to iug-attendance-pro)"; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: abdulrahmanahmedelabed-prog/iug-attendance-pro
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
          path: src
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tests (names and results only; no source lines in this public log)
        working-directory: src
        timeout-minutes: 20
        run: |
          python -m pip install -q -r requirements-dev.txt pytest-timeout
          python -m pytest -v --tb=no -p no:warnings --timeout=180 --timeout-method=signal tests
      - if: always()
        run: rm -rf src

  build:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: The source key is set
        shell: bash
        env:
          KEY: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Add the secret PRIVATE_SOURCE_TOKEN (read-only key to iug-attendance-pro)"; exit 1; }
      - name: Source (private, read-only, not kept)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: abdulrahmanahmedelabed-prog/iug-attendance-pro
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
          path: src
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: src
        run: python -m pip install -q -r requirements.txt "nuitka==4.2.2" ordered-set zstandard
      - name: The version asked for is the program's version
        working-directory: src
        shell: bash
        run: |
          v=$(python -c "from hader.version import VERSION; print(VERSION)")
          [ "v$v" = "${{ inputs.version }}" ] || { echo "::error::asked for ${{ inputs.version }} but the program is $v"; exit 1; }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-4.2.2-${{ hashFiles('src/requirements.txt') }}-${{ inputs.version }}
          restore-keys: nuitka-${{ runner.os }}-4.2.2-${{ hashFiles('src/requirements.txt') }}-
      - name: Build Hader.exe (compiled)
        working-directory: src
        run: python tools/build_exe.py
      - name: Smoke test (the server starts and answers; no source shipped)
        working-directory: src
        shell: pwsh
        run: |
          $data = "$env:RUNNER_TEMP\smoke"
          $p = Start-Process dist\Hader\Hader.exe -ArgumentList "--data", $data, "--web", "18090", "--adms", "18091", "--portal", "0", "--host", "127.0.0.1" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
            try { $r = Invoke-RestMethod http://127.0.0.1:18090/api/ping -TimeoutSec 3; if ($r.ok) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Hader.exe did not answer" }
          if (Get-ChildItem -Recurse dist\Hader -Include *.py) { throw "a source file would be shipped" }
          & dist\Hader\Hader.exe --tool reset_password admin Smoke-Test-2026
          if ($LASTEXITCODE -ne 0) { throw "helpers through Hader.exe failed" }
      - name: Installer (Inno Setup)
        working-directory: src
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $v = "${{ inputs.version }}".TrimStart("v")
          & $iscc /Q "/DAppVersion=$v" installer\Hader.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Copy-Item dist\installer\Hader-Setup.exe "$env:GITHUB_WORKSPACE\Hader-Setup.exe"
      - name: Publish the installer (only it) on this repository's releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.version }}
          name: حاضر ${{ inputs.version }}
          make_latest: true
          files: Hader-Setup.exe
          body: |
            ## تحميل البرنامج
            **`Hader-Setup.exe`** — ملف التثبيت لويندوز 10 و11 (64 بت). لا يحتاج بايثون ولا أي برنامج آخر.

            1. شغّل الملف ووافق على صلاحيات المسؤول. إن ظهر «ويندوز حمى جهازك»: «معلومات إضافية» ← «تشغيل على أي حال».
            2. يفتح «مدير خادم حاضر» بعد التثبيت؛ اضغط «فتح البرنامج» وادخل بالمستخدم admin وكلمة المرور الأولى الظاهرة فيه.
            3. التجربة كاملة 30 يوماً. للتفعيل: «حول البرنامج» ← أرسل رمز الجهاز للمزوّد والصق المفتاح.

            البيانات في `C:\ProgramData\Hader` ولا يمسّها التحديث ولا الإزالة. النسخ المثبّتة تتحدث من «مدير الخادم» ← التحديثات.
      - name: Remove the source from the runner
        if: always()
        shell: bash
        run: rm -rf src
